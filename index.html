
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plate Tycoon | Simulator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background: #0f172a; color: white; }
        .plate-font { font-family: 'serif'; font-weight: bold; letter-spacing: 2px; }
        .plate-bg {
            background: linear-gradient(to bottom, #ffffff 0%, #e2e8f0 100%);
            border: 4px solid #334155;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        .rarity-common { color: #94a3b8; }
        .rarity-rare { color: #3b82f6; text-shadow: 0 0 10px #3b82f6; }
        .rarity-epic { color: #a855f7; text-shadow: 0 0 15px #a855f7; }
        .rarity-legendary { color: #eab308; text-shadow: 0 0 20px #eab308; }
    </style>
</head>
<body class="flex flex-col items-center justify-center min-h-screen p-4">

    <!-- Header / Stats -->
    <div class="fixed top-0 w-full max-w-md flex justify-between p-6 bg-slate-900/80 backdrop-blur-md border-b border-slate-700">
        <div>
            <p class="text-slate-400 text-xs uppercase tracking-widest">Баланс</p>
            <p id="money" class="text-2xl font-black text-green-400">0 ₽</p>
        </div>
        <div class="text-right">
            <p class="text-slate-400 text-xs uppercase tracking-widest">Собрано номеров</p>
            <p id="collected" class="text-2xl font-black text-blue-400">0</p>
        </div>
    </div>

    <!-- Game Main Area -->
    <div class="mt-20 flex flex-col items-center w-full max-w-md">

        <!-- License Plate Display -->
        <div id="plate-container" class="plate-bg w-full aspect-[1.5/1] rounded-xl flex flex-col items-center justify-center p-4 mb-8 transition-all duration-300 transform scale-95 opacity-50">
            <div class="flex items-center justify-between w-full h-full">
                <div class="text-slate-800 text-4xl font-black plate-font" id="plate-letters">А 000 АА</div>
                <div class="flex flex-col items-center">
                    <div class="text-slate-800 text-5xl font-black plate-font" id="plate-numbers">777</div>
                    <div class="text-slate-800 text-2xl font-bold" id="plate-region">77</div>
                </div>
            </div>
            <div class="absolute bottom-2 right-4 text-[8px] text-slate-500 uppercase font-bold">RUSSIAN FEDERATION</div>
        </div>

        <!-- Info -->
        <div class="text-center mb-8">
            <p id="rarity-text" class="text-lg font-bold uppercase tracking-tighter rarity-common">Обычный номер</p>
            <p id="price-text" class="text-slate-400 text-sm">Оценка: 0 ₽</p>
        </div>

        <!-- Controls -->
        <div class="grid grid-cols-1 gap-4 w-full">
            <button onclick="generatePlate()" id="btn-gen" class="bg-white text-slate-900 font-black py-4 rounded-2xl hover:bg-slate-200 transition-all active:scale-95 shadow-lg">
                СГЕНЕРИРОВАТЬ
            </button>
            <button onclick="sellPlate()" id="btn-sell" disabled class="bg-slate-700 text-slate-400 font-black py-4 rounded-2xl cursor-not-allowed transition-all">
                ПРОДАТЬ
            </button>
        </div>

    </div>

    <script>
        // Game State
        let gameState = {
    const letters = "АВЕКМНОРСТУХ";
    const regions = [77, 99, 177, 777, 50, 90, 199, 797, 197];

    // Rarity Config
    const RARITY_TYPES = {
        COMMON: { label: 'Обычный', multiplier: 1, class: 'rarity-common' },
        RARE: { label: 'Редкий', multiplier: 5, class: 'rarity-rare' },
        EPIC: { label: 'Эпический', multiplier: 25, class: 'rarity-epic' },
        LEGENDARY: { label: 'Легендарный', multiplier: 150, class: 'rarity-legendary' }
    };

    function generatePlate() {
        // 1. Generate base components
        let l1 = letters[Math.floor(Math.random() * letters.length)];
        let l2 = letters[Math.floor(Math.random() * letters.length)];
        let l3 = letters[Math.floor(Math.random() * letters.length)];

        let n1 = Math.floor(Math.random() * 10);
        let n2 = Math.floor(Math.random() * 10);
        let n3 = Math.floor(Math.random() * 10);

        let reg = regions[Math.floor(Math.random() * regions.length)];

        let plateStr = `${l1} ${n1}${n2}${n3} ${l2}${l3}`;
        let numStr = `${n1}${n2}${n3}`;

        // 2. Calculate Rarity
        let rarity = RARITY_TYPES.COMMON;
        let score = 0;

        // Check for triple numbers (777)
        if (n1 === n2 && n2 === n3) score += 2;
        // Check for triple letters (AAA)
        if (l1 === l2 && l2 === l3) score += 2;
        // Check for "mirror" numbers (121)
        if (n1 === n3) score += 1;
        // Check for "lucky" region
        if (reg === 77 || reg === 777) score += 1;

        if (score >= 4) rarity = RARITY_TYPES.LEGENDARY;
        else if (score >= 3) rarity = RARITY_TYPES.EPIC;
        else if (score >= 1) rarity = RARITY_TYPES.RARE;

        // 3. Set Price
        let basePrice = 100;
        let finalPrice = Math.floor(basePrice * rarity.multiplier * (1 + score * 0.5));

        // 4. Update State
        gameState.currentPlate = {
            display: plateStr,
            numbers: numStr,
            region: reg,
            letters: `${l1} ${l2}${l3}`, // for display
            price: finalPrice,
            rarity: rarity
        };

        updateUI();

        // Animation trigger
        const container = document.getElementById('plate-container');
        container.classList.remove('scale-95', 'opacity-50');
        container.classList.add('scale-100', 'opacity-100');

        // Enable Sell Button
        const sellBtn = document.getElementById('btn-sell');
        sellBtn.disabled = false;
        sellBtn.classList.remove('bg-slate-700', 'text-slate-400', 'cursor-not-allowed');
        sellBtn.classList.add('bg-green-500', 'text-white', 'hover:bg-green-400');
    }

    function updateUI() {
        const p = gameState.currentPlate;
        if (!p) return;

        document.getElementById('plate-letters').innerText = p.letters;
        document.getElementById('plate-numbers').innerText = p.numbers;
        document.getElementById('plate-region').innerText = p.region;

        const rarityEl = document.getElementById('rarity-text');
        rarityEl.innerText = p.rarity.label;
        rarityEl.className = `text-lg font-bold uppercase tracking-tighter ${p.rarity.class}`;

        document.getElementById('price-text').innerText = `Оценка: ${p.price.toLocaleString()} ₽`;
        document.getElementById('money').innerText = `${gameState.money.toLocaleString()} ₽`;
        document.getElementById('collected').innerText = gameState.collectedCount;
    }
        gameState.money += gameState.currentPlate.price;
        gameState.collectedCount += 1;
        gameState.currentPlate = null;

        // Reset UI
        const container = document.getElementById('plate-container');
        container.classList.add('scale-95', 'opacity-50');

        const sellBtn = document.getElementById('btn-sell');
        sellBtn.disabled = true;
        sellBtn.classList.add('bg-slate-700', 'text-slate-400', 'cursor-not-allowed');
        sellBtn.classList.remove('bg-green-500', 'text-white', 'hover:bg-green-400');

        updateUI();
    }
</script>
